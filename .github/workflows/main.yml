name: RDP greenboyMC - SUPER CLEAN BASIC RDP (Stable Connect 2026)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download & Extract Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath . -Force
          Move-Item -Path "ngrok.exe" -Destination "." -Force

      - name: Auth Ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN

      - name: BASIC CLEAN RDP SETUP
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Create user
          $Password = ConvertTo-SecureString "W1nd0ws-P4ssw0rd-2025!" -AsPlainText -Force
          New-LocalUser "greenboyMC" -Password $Password -FullName "Clean User" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "greenboyMC"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "greenboyMC"

          # Chỉ tắt sleep và lock để tránh disconnect khi idle
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -standby-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          reg add "HKCU\Control Panel\Desktop" /v "ScreenSaveActive" /t REG_SZ /d "0" /f

          Write-Host "🚀 RDP SIÊU SẠCH SẴN SÀNG - KHÔNG TẢI NẶNG!"

      - name: Start Ngrok AP & Hiện IP
        run: |
          Write-Host "=================================================="
          Write-Host "🚀 RDP BASIC CLEAN - REGION AP (MƯỢT NHẤT VN) 🚀"
          Write-Host "Username: greenboyMC"
          Write-Host "Password: W1nd0ws-P4ssw0rd-2025!"
          Write-Host "=================================================="

          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --region ap" -NoNewWindow

          $attempt = 0
          while ($attempt -lt 20) {
            Start-Sleep -Seconds 5
            try {
              $tunnels = Invoke-RestMethod http://localhost:4040/api/tunnels
              $tcp = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" }
              if ($tcp) {
                $hostPort = $tcp.public_url -replace "tcp://",""
                Write-Host "🚀 CONNECT NGAY BRO - BẢN SẠCH NÀY ỔN HƠN NÈ! 🚀"
                Write-Host "Address: $hostPort"
                Write-Host "Host: $($hostPort.Split(':')[0])"
                Write-Host "Port: $($hostPort.Split(':')[1])"
                Write-Host "=================================================="
                break
              }
            } catch {}
            $attempt++
          }

          Start-Sleep -Seconds 21600
