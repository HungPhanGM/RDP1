name: RDP greenboyMC - TIKTOK LIVE NO LAG + STABLE FIX ERROR 0x4 (2026)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download & Extract Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath . -Force
          Move-Item -Path "ngrok.exe" -Destination "." -Force

      - name: Auth Ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if (-not $Env:NGROK_AUTH_TOKEN) { Write-Error "NGROK_AUTH_TOKEN secret chưa được set!" }
          .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN

      - name: ULTIMATE STABLE TIKTOK LIVE + FIX ERROR 0x4 + OBS AUTO
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # User
          $Password = ConvertTo-SecureString "W1nd0ws-P4ssw0rd-2025!" -AsPlainText -Force
          New-LocalUser "greenboyMC" -Password $Password -FullName "TIKTOK PRO" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "greenboyMC"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "greenboyMC"

          # FIX ERROR 0x4: Tắt sleep, screen lock, timeout
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c  # High Performance
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -standby-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v "InactivityTimeoutSecs" /t REG_DWORD /d 0 /f
          reg add "HKCU\Control Panel\Desktop" /v "ScreenSaveActive" /t REG_SZ /d "0" /f

          # Ultra low latency visuals
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012078010000000 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 3 /f
          reg add "HKCU\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f

          # Kill heavy services
          $services = @("SysMain","WSearch","DiagTrack","wuauserv","bits","WindowsSearch","MapsBroker","lfsvc","DoSvc","WaaSMedicSvc")
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # TESLA FAKE + Low Latency Tweaks
          $tsPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $tsPath -Force | Out-Null
          Set-ItemProperty -Path $tsPath -Name "AVCHardwareEncodePreferred" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "AVC444ModePreferred" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "fEnableRemoteFX" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MaxCompressionLevel" -Value 0 -Type DWord

          reg add "HKLM\SYSTEM\CurrentControlSet\Services\TermDD" /v "FlowControlDisable" /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\TermDD" /v "FlowControlDisplayBandwidth" /t REG_DWORD /d 300 /f

          # UDP + Network Optimize
          $clientPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\Client'
          New-Item -Path $clientPath -Force | Out-Null
          Set-ItemProperty -Path $clientPath -Name "fClientDisableUDP" -Value 0 -Type DWord
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" /v NetworkThrottlingIndex /t REG_DWORD /d 4294967295 /f

          # Auto Install OBS Studio 32.0.4 Portable (Latest Official)
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/32.0.4/OBS-Studio-32.0.4-Windows-x64.zip" -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath "C:\OBS" -Force

          # Mouse Jiggler to prevent idle disconnect (Keep Alive)
          $jiggler = @'
          while ($true) {
            $pos = [System.Windows.Forms.Cursor]::Position
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(($pos.X + 1), $pos.Y)
            Start-Sleep -Milliseconds 500
            [System.Windows.Forms.Cursor]::Position = $pos
            Start-Sleep -Seconds 30
          }
'@
          $jiggler | Out-File -FilePath "C:\jiggler.ps1" -Encoding ASCII
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\jiggler.ps1" -WindowStyle Hidden

          Write-Host "🚀 FIX ERROR 0x4 HOÀN TẤT - SESSION ỔN ĐỊNH 6 GIỜ!"
          Write-Host "🎥 OBS tại C:\OBS\bin\64bit\obs64.exe - LIVE TIKTOK MƯỢT KHÔNG GIẬT!"

      - name: Start Ngrok Asia & IP STABLE
        run: |
          Write-Host "=================================================="
          Write-Host "🚀 TIKTOK LIVE RDP - STABLE NO ERROR 0x4 2026 🚀"
          Write-Host "Username: greenboyMC"
          Write-Host "Password: W1nd0ws-P4ssw0rd-2025!"
          Write-Host "🎥 OBS Ready | Mouse Jiggler ON | No Sleep/Lock"
          Write-Host "=================================================="

          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --region ap --log=stdout" -RedirectStandardOutput "ngrok.log" -NoNewWindow

          $maxAttempts = 25
          $attempt = 0
          $tunnelUrl = $null

          while ($attempt -lt $maxAttempts -and -not $tunnelUrl) {
            Start-Sleep -Seconds 4
            $attempt++
            try {
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -TimeoutSec 8
              $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" }
              if ($tcpTunnel) { $tunnelUrl = $tcpTunnel.public_url }
            } catch {
              Write-Host "⏳ Đang khởi động stable RDP... ($attempt/$maxAttempts)"
            }
          }

          if ($tunnelUrl) {
            $hostPort = $tunnelUrl -replace "tcp://", ""
            Write-Host "🎥 CONNECT NGAY - KHÔNG CÒN LỖI 0x4 NỮA! 🎥"
            Write-Host "Address: $hostPort"
            Write-Host "Host: $($hostPort.Split(':')[0])"
            Write-Host "Port: $($hostPort.Split(':')[1])"
            Write-Host "=================================================="
          } else {
            Write-Host "❌ IP Error - Run lại thử!"
          }

          Start-Sleep -Seconds 21600
